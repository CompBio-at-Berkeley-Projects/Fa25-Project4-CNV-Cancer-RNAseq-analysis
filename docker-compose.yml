# Docker Compose for CNV-Cancer-RNAseq-Analysis
# CopyKAT-based single-cell RNA-seq CNV analysis pipeline
#
# Usage:
#   docker compose up --build          # Build and start all services
#   docker compose up -d               # Start in detached mode
#   docker compose logs -f             # Follow logs
#   docker compose down                # Stop all services
#   docker compose down -v             # Stop and remove volumes

version: '3.8'

services:
  # Backend API Service (Python + R + CopyKAT)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copykat-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist results data
      - results_data:/app/backend/results
      # Mount sample data (optional - remove if not needed)
      - ./backend/data:/app/backend/data:ro
    environment:
      - DOCKER_MODE=true
      - R_EXECUTABLE=Rscript
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/files"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Resource limits (adjust based on your data size)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: copykat-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  results_data:
    name: copykat-results
    driver: local

networks:
  default:
    name: copykat-network

